name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # v4 required — v3 fails on removed SDK package "tools"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build
        env:
          VITE_WORKER_URL: https://youngtube-worker.saaedbelal.workers.dev

      - name: Add Capacitor Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK
        env:
          ADMIN_KEYSTORE_BASE64: ${{ secrets.ADMIN_RELEASE_KEYSTORE_BASE64 }}
          ADMIN_KEYSTORE_PASSWORD: ${{ secrets.ADMIN_RELEASE_KEYSTORE_PASSWORD }}
          ADMIN_KEY_ALIAS: ${{ secrets.ADMIN_RELEASE_KEY_ALIAS }}
          ADMIN_KEY_PASSWORD: ${{ secrets.ADMIN_RELEASE_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$ADMIN_KEYSTORE_BASE64" ]; then
            echo "Keystore secret detected: building signed release APK..."
            KEYSTORE_FILE=$(mktemp)
            echo "$ADMIN_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            ADMIN_RELEASE_KEYSTORE_PATH="$KEYSTORE_FILE" \
            ADMIN_RELEASE_KEYSTORE_PASSWORD="$ADMIN_KEYSTORE_PASSWORD" \
            ADMIN_RELEASE_KEY_ALIAS="$ADMIN_KEY_ALIAS" \
            ADMIN_RELEASE_KEY_PASSWORD="$ADMIN_KEY_PASSWORD" \
            ./gradlew assembleRelease --no-daemon
            rm -f "$KEYSTORE_FILE"
          else
            echo "No release keystore configured: building assembleDebug APK..."
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-youngtube-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
